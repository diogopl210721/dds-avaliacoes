# Temporário: baixa as fotos de exemplo (Unsplash) usadas nos modelos, para gravar o vídeo de demonstração.
# O branch tmp-fotos-video é apagado logo depois.
name: tmp fotos video
on:
  push:
    branches: [tmp-fotos-video]
permissions:
  contents: read
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir fotos
          while read id; do
            curl -sfL --retry 2 "https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=1000&q=78&fm=jpg" -o "fotos/${id}.jpg" || echo "falhou ${id}"
          done < photo_ids.txt
          ls fotos | wc -l; du -sh fotos
      - uses: actions/upload-artifact@v4
        with:
          name: fotos
          path: fotos
          retention-days: 1
